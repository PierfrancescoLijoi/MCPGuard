name: MCP Server Compliance

# Manual example of the MCPGuard action. It runs the action from this checkout
# against a server command you provide, so it never fails on ordinary pushes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "MCP server command or Streamable HTTP URL to scan"
        required: true
        default: "npx -y @modelcontextprotocol/server-everything"

jobs:
  mcpguard:
    name: Protocol compliance scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Scan MCP server
        uses: ./
        with:
          target: ${{ inputs.target }}
          output: markdown
          fail-on-error: "true"
