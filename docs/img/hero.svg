<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="MCPGuard results: 93.3% precision and 73.7% recall on a 58-case labeled corpus, 6 of 6 catalog changes detected, 4 of 4 real servers scanned in under 4 seconds"><title>MCPGuard results</title><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}.d{fill:#8b949e}.b{font-weight:700}</style><rect width="1200" height="330" rx="18" fill="#0d1117"/><text x="60" y="56" font-size="30" class="b">MCPGuard</text><text x="60" y="82" font-size="15" class="d">The CI quality gate for MCP servers: protocol, security rules, rug-pull baselines and fuzzing in one command.</text>
<rect x="40" y="112" width="262" height="178" rx="12" fill="#161b22" stroke="#30363d"/><rect x="40" y="124" width="4" height="154" rx="2" fill="#2dd4bf"/><text x="62" y="186" font-size="46" class="b" fill="#2dd4bf" style="fill:#2dd4bf">93.3%</text><text x="62" y="214" font-size="14" class="b">precision</text><text x="62" y="236" font-size="12" class="d">2 of 20 benign tools flagged,</text><text x="62" y="254" font-size="12" class="d">both are password and key tools</text>
<rect x="322" y="112" width="262" height="178" rx="12" fill="#161b22" stroke="#30363d"/><rect x="322" y="124" width="4" height="154" rx="2" fill="#60a5fa"/><text x="344" y="186" font-size="46" class="b" style="fill:#60a5fa">73.7%</text><text x="344" y="214" font-size="14" class="b">recall on a hard corpus</text><text x="344" y="236" font-size="12" class="d">28 of 38 attacks caught, with</text><text x="344" y="254" font-size="12" class="d">every miss listed in the README</text>
<rect x="604" y="112" width="262" height="178" rx="12" fill="#161b22" stroke="#30363d"/><rect x="604" y="124" width="4" height="154" rx="2" fill="#a78bfa"/><text x="626" y="186" font-size="46" class="b" style="fill:#a78bfa">6 / 6</text><text x="626" y="214" font-size="14" class="b">catalog changes caught</text><text x="626" y="236" font-size="12" class="d">renamed, rewritten, new schema,</text><text x="626" y="254" font-size="12" class="d">added or removed tools</text>
<rect x="886" y="112" width="274" height="178" rx="12" fill="#161b22" stroke="#30363d"/><rect x="886" y="124" width="4" height="154" rx="2" fill="#fbbf24"/><text x="908" y="186" font-size="46" class="b" style="fill:#fbbf24">4 / 4</text><text x="908" y="214" font-size="14" class="b">real servers, under 4 s each</text><text x="908" y="236" font-size="12" class="d">official npm servers scanned,</text><text x="908" y="254" font-size="12" class="d">0 false errors</text>
<text x="60" y="314" font-size="12" class="d">Labeled corpus: 38 malicious and 20 benign tool definitions. Reproduce with benchmarks/detection.py and benchmarks/real_servers.py.</text></svg>
