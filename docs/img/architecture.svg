<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="MCPGuard architecture: targets, transports, checks, reporter, outputs"><title>MCPGuard architecture</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e6edf3}.d{fill:#8b949e}.b{font-weight:700}.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}</style><rect width="1200" height="470" rx="18" fill="#0d1117"/><text x="60" y="50" font-size="26" class="b">Architecture</text><text x="60" y="74" font-size="14" class="d">One scan, two transports, one report. Every step is deterministic and the exit code is the gate.</text>

<text x="40" y="112" font-size="12" class="d b">1  TARGET</text><text x="272" y="112" font-size="12" class="d b">2  TRANSPORT</text><text x="520" y="112" font-size="12" class="d b">3  CHECKS</text><text x="826" y="112" font-size="12" class="d b">4  REPORT</text><text x="1000" y="112" font-size="12" class="d b">5  GATE</text>

<rect x="40" y="124" width="200" height="82" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><text x="58" y="150" font-size="14" class="b">Server command</text><text x="58" y="170" font-size="12" class="m d">python server.py</text><text x="58" y="188" font-size="12" class="m d">npx -y @scope/server</text>
<rect x="40" y="226" width="200" height="82" rx="12" fill="#161b22" stroke="#60a5fa" stroke-width="1.5"/><text x="58" y="252" font-size="14" class="b">HTTP endpoint</text><text x="58" y="272" font-size="12" class="m d">https://host/mcp</text><text x="58" y="290" font-size="12" class="d">bearer token, headers</text>

<rect x="272" y="124" width="216" height="82" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><text x="290" y="150" font-size="14" class="b">stdio session</text><text x="290" y="170" font-size="12" class="m d">transport.py</text><text x="290" y="188" font-size="12" class="d">MCP SDK, initialize</text>
<rect x="272" y="226" width="216" height="82" rx="12" fill="#161b22" stroke="#60a5fa" stroke-width="1.5"/><text x="290" y="252" font-size="14" class="b">Stateless HTTP</text><text x="290" y="272" font-size="12" class="m d">http_transport.py</text><text x="290" y="290" font-size="12" class="d">server/discover, 2026-07-28</text>
<path d="M240 165L270 165M240 267L270 267" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

<rect x="520" y="124" width="276" height="272" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/>
<text x="538" y="150" font-size="14" class="b">checker.py orchestrates</text>
<text x="538" y="178" font-size="12" class="b" style="fill:#a78bfa">Protocol</text><text x="610" y="178" font-size="12" class="d">handshake, version, identity,</text><text x="610" y="194" font-size="12" class="d">tools, resources, prompts lists</text>
<text x="538" y="222" font-size="12" class="b" style="fill:#a78bfa">Security</text><text x="610" y="222" font-size="12" class="d">security.py, poisoning.py: secrets,</text><text x="610" y="238" font-size="12" class="d">injection, tool orders, schemas</text>
<text x="538" y="266" font-size="12" class="b" style="fill:#a78bfa">Rug-pull</text><text x="610" y="266" font-size="12" class="d">baseline.py: SHA-256 of the</text><text x="610" y="282" font-size="12" class="d">whole tool catalog</text>
<text x="538" y="310" font-size="12" class="b" style="fill:#a78bfa">Fuzzing</text><text x="610" y="310" font-size="12" class="d">fuzzer.py: bounded cases from</text><text x="610" y="326" font-size="12" class="d">each JSON Schema, HTTP only</text>
<text x="538" y="354" font-size="12" class="b" style="fill:#a78bfa">Speed</text><text x="610" y="354" font-size="12" class="d">benchmark.py: startup latency,</text><text x="610" y="370" font-size="12" class="d">p50 and p95 under load</text>
<path d="M488 165L518 230M488 267L518 267" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

<rect x="826" y="124" width="150" height="272" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/><text x="844" y="150" font-size="14" class="b">reporter.py</text><text x="844" y="182" font-size="12">JSON</text><text x="844" y="200" font-size="12" class="d">for scripts</text><text x="844" y="232" font-size="12">Markdown</text><text x="844" y="250" font-size="12" class="d">for people</text><text x="844" y="282" font-size="12">SARIF 2.1.0</text><text x="844" y="300" font-size="12" class="d">for code scanning,</text><text x="844" y="316" font-size="12" class="d">with OWASP MCP ids</text>
<path d="M796 260L824 260" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

<rect x="1000" y="124" width="160" height="124" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="1018" y="150" font-size="14" class="b">Exit code</text><text x="1018" y="178" font-size="12" class="m">0</text><text x="1042" y="178" font-size="12" class="d">all required passed</text><text x="1018" y="200" font-size="12" class="m">1</text><text x="1042" y="200" font-size="12" class="d">a check failed</text><text x="1018" y="222" font-size="12" class="m">2</text><text x="1042" y="222" font-size="12" class="d">invalid input</text>
<rect x="1000" y="272" width="160" height="124" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="1018" y="298" font-size="14" class="b">GitHub Action</text><text x="1018" y="324" font-size="12" class="d">uploads the report</text><text x="1018" y="342" font-size="12" class="d">artifact, optional</text><text x="1018" y="360" font-size="12" class="d">code scanning upload</text>
<path d="M976 186L998 186M976 334L998 334" stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

<text x="60" y="430" font-size="12" class="d">Security rules read tool declarations only. MCPGuard never calls a tool unless you pass --fuzz, and destructive-looking tools stay skipped without --allow-dangerous-tools.</text>
<text x="60" y="450" font-size="12" class="d">Typer CLI (cli.py) wires the pieces and owns the exit codes.</text></svg>
